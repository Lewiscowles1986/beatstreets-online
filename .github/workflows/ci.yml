# CI: verify typecheck, lint and tests pass on every push/PR, and that the app
# builds. This is the gate that all commits must satisfy — a commit that breaks the
# build fails CI.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build app
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
