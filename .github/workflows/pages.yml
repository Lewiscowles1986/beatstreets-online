# Build the app + Storybook and deploy both to GitHub Pages.
# The app is served at the site root; the Storybook build is linked from the app
# (see the "Storybook" link in the UI).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck + build app
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Assemble site (app + storybook)
        run: |
          mkdir -p _site/storybook
          cp -r dist/* _site/
          cp -r storybook-static/* _site/storybook/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
